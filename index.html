<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>B-JOB FBS</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <link rel="stylesheet" href="./src/warehouse.css" />
  <link rel="stylesheet" href="./src/warehouse-fixes.css" />
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
    #boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .boot-card{width:min(520px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:28px;box-shadow:0 12px 40px #10182814}
    .boot-card h1{margin:0 0 8px;font-size:24px}.boot-card p{margin:0;color:#667085}.boot-error{display:none;margin-top:16px;padding:12px;border-radius:9px;background:#fef3f2;color:#b42318;font-size:13px;white-space:pre-wrap}
  </style>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="app">
    <main id="boot"><section class="boot-card"><h1>B-JOB FBS</h1><p>Загрузка приложения…</p><div id="bootError" class="boot-error"></div></section></main>
  </div>
  <noscript><main id="boot"><section class="boot-card"><h1>B-JOB FBS</h1><p>Для работы приложения необходимо включить JavaScript.</p></section></main></noscript>
  <script>
    window.addEventListener('error', function (event) {
      var box = document.getElementById('bootError');
      if (box) { box.style.display = 'block'; box.textContent = 'Не удалось запустить приложение.\n' + (event.error?.message || event.message || 'Неизвестная ошибка'); }
    });
    window.addEventListener('unhandledrejection', function (event) {
      var box = document.getElementById('bootError');
      if (box) { box.style.display = 'block'; box.textContent = 'Ошибка запуска приложения.\n' + (event.reason?.message || String(event.reason)); }
    });
  </script>
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/nomenclature.js"></script>
  <script type="module" src="./src/warehouse.js"></script>
  <script type="module" src="./src/warehouse-resize.js"></script>
</body>
</html>
